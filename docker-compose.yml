version: '3.8'

services:
  app:
    build: .
    image: pandit-ai-chat:latest
    container_name: pandit-ai-chat
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/panditai
      # Add any other env vars you need

  db:
    image: postgres:15-alpine
    container_name: pandit-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: panditai
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data: 